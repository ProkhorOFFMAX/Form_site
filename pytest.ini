[pytest]
markers =
    unit: юнит-тесты (без Flask и БД)
    api: тесты API (JSON)
    schema: тесты схемы БД

# Логирование в консоль (видно всегда)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Логирование в файл (для истории)
log_file = logs/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s