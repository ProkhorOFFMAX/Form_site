stages:
  - test

variables:
  # Переменные для сервиса PostgreSQL
  POSTGRES_DB: test_db
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: test_db
  DB_USER: test_user
  DB_PASSWORD: test_password
  DATABASE_URL: "postgresql+psycopg2://test_user:test_password@postgres:5432/test_db"
  # Кэш pip, чтобы не скачивать зависимости каждый раз
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.11
  tags:
    - docker
  services:
    - name: postgres:16-alpine
      alias: postgres
  script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest
    - alembic upgrade head
    - pytest -v --junitxml=report.xml --cov=. --cov-report=xml:coverage.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverege.xml
    paths:
      - report.xml
      - coverage.xml