stages:
  - test

variables:
  # Переменные для сервиса PostgreSQL
  POSTGRES_DB: test_db
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: test_db
  DB_USER: test_user
  DB_PASSWORD: test_password
  DATABASE_URL: "postgresql+psycopg2://test_user:test_password@postgres:5432/test_db"
  # Кэш pip, чтобы не скачивать зависимости каждый раз
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

# Общий шаблон для тестовых задач (чтобы не дублировать код)
.test_template: &test_template
  stage: test
  image: python:3.11
  tags:
    - docker
  services:
    - name: postgres:16-alpine
      alias: postgres
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
    - alembic upgrade head

# Проверка БД
test_schema:
  <<: *test_template
  script:
    - pytest -m schema -v --junitxml=report-schema.xml --cov=. --cov-report=xml:coverage-schema.xml
  artifacts:
    when: always
    reports:
      junit: report-schema.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-schema.xml
    paths:
      - report-schema.xml
      - coverage-schema.xml

# Юнит-тесты (быстрые, без БД)
test_unit:
  <<: *test_template
  script:
    - pytest -m unit -v --junitxml=report-unit.xml --cov=. --cov-report=xml:coverage-unit.xml
  artifacts:
    when: always
    reports:
      junit: report-unit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-unit.xml
    paths:
     - report-unit.xml
     - coverage-unit.xml

# API-тесты
test_api:
  stage: test
  needs: ["test_schema"]
  image: python:3.11
  tags:
    - docker
  services:
    - name: postgres:16-alpine
      alias: postgres
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
    - alembic upgrade head
  script:
    - pytest -m api -v --junitxml=report-api.xml 2>&1 | tee test-api.log --cov=. --cov-report=xml:coverage-api.xml
  after_script:
    - |
      if [ "$CI_JOB_STATUS" == "failed" ]; then
              LOG_LINE=$(cat test-api.log | tail -50 | tr '\n' ' ' | sed 's/"/\\"/g')
              curl -X POST "http://172.17.0.1:3100/loki/api/v1/push" \
                -H "Content-Type: application/json" \
                -d "{\"streams\": [{\"stream\": {\"job\": \"gitlab-ci\", \"test_group\": \"api\", \"status\": \"failed\"}, \"values\": [[\"$(date +%s%N)\", \"$LOG_LINE\"]]}]}"
      fi
  artifacts:
    when: always
    reports:
      junit: report-api.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-api.xml
    paths:
     - report-api.xml
     - coverage-api.xml



