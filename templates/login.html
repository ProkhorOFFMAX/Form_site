<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
    <h1>Вход в систему</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label>Email:<br>
            <input type="email" name="email" required>
        </label><br><br>
        <label>Пароль:<br>
            <input type="password" name="password" required>
        </label><br><br>
        <button type="submit">Войти</button>
    </form>
</body>
</html>
