<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Шаблоны анкет</title>
</head>
<body>
    <h1>Список шаблонов</h1>

    {% if templates %}
        <ul>
        {% for t in templates %}
            <li>
                <a href="/fill/{{ t.id }}">{{ t.name }}</a>
                <small>(создан: {{ t.created_at }})</small>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Пока нет ни одного шаблона.</p>
    {% endif %}

    <p><a href="/create">Создать новый шаблон</a></p>
    <p><a href="/institutions">Список оброзавательных учреждений</a></p>
</body>
</html>
